<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nieuw wachtwoord | Hummie Bear</title>

  <meta
    name="description"
    content="Stel een nieuw wachtwoord in voor het Hummie Bear beheer."
  >

  <style>
    :root {
      --pink: #efa0bd;
      --pink-dark: #d77b9f;
      --pink-light: #fce7ef;
      --cream: #fff8f1;
      --brown: #3f2b25;
      --muted: #806d65;
      --white: #ffffff;
      --line: #eadbd4;
      --shadow: 0 20px 60px rgba(63, 43, 37, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top left, #fdebf2 0, transparent 35%),
        var(--cream);
      color: var(--brown);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--white);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 40px;
      box-shadow: var(--shadow);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-badge {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      border-radius: 20px;
      background: var(--pink-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 30px;
      letter-spacing: -0.5px;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      line-height: 1.5;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #fff;
      color: var(--brown);
      font-size: 16px;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: var(--pink-dark);
      box-shadow: 0 0 0 4px rgba(239, 160, 189, 0.18);
    }

    .requirements {
      margin: 8px 0 22px;
      padding: 14px 16px;
      border-radius: 14px;
      background: #fff8fb;
      border: 1px solid #f4dbe6;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      background: var(--pink-dark);
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      background: #c9688e;
    }

    button:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #edf8f0;
      border: 1px solid #cce8d2;
      color: #28643a;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      border: 1px solid #efcaca;
      color: #9b3030;
    }

    .back-link {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: var(--muted);
      text-decoration: none;
      font-size: 14px;
    }

    .back-link:hover {
      color: var(--pink-dark);
    }

    .loading {
      text-align: center;
      color: var(--muted);
      line-height: 1.5;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .card {
        padding: 28px 22px;
        border-radius: 22px;
      }

      .brand h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <main class="card">

    <div class="brand">
      <div class="brand-badge">🐻</div>

      <h1>Nieuw wachtwoord</h1>

      <p>
        Stel hier een nieuw wachtwoord in voor het
        Hummie Bear beheer.
      </p>
    </div>

    <div id="loading" class="loading">
      Beveiligde resetlink controleren...
    </div>

    <form id="resetForm" style="display:none;">

      <div class="form-group">
        <label for="password">
          Nieuw wachtwoord
        </label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="Nieuw wachtwoord"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="form-group">
        <label for="passwordConfirm">
          Herhaal wachtwoord
        </label>

        <input
          type="password"
          id="passwordConfirm"
          name="passwordConfirm"
          placeholder="Herhaal wachtwoord"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="requirements">
        Gebruik minstens 8 tekens. Zorg ervoor dat beide
        wachtwoorden exact hetzelfde zijn.
      </div>

      <button type="submit" id="submitButton">
        Wachtwoord instellen
      </button>

      <div id="message" class="message"></div>

    </form>

    <a
      href="https://hummiebear.be/admin.html"
      class="back-link"
    >
      Terug naar Hummie Bear beheer
    </a>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://yrcajvpstbyupohjbavm.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_TjBCB01RHm67xQVm3CtvEw_b0qxk1D";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loading = document.getElementById("loading");
    const resetForm = document.getElementById("resetForm");
    const passwordInput = document.getElementById("password");
    const passwordConfirmInput =
      document.getElementById("passwordConfirm");
    const submitButton =
      document.getElementById("submitButton");
    const message =
      document.getElementById("message");

    function showMessage(text, type) {
      message.textContent = text;
      message.className = "message " + type;
    }

    async function initialiseRecovery() {
      try {
        /*
          Supabase sends the recovery session back to this page.
          We listen for PASSWORD_RECOVERY before allowing
          the user to change the password.
        */

        const { data } =
          await supabaseClient.auth.getSession();

        if (data && data.session) {
          loading.style.display = "none";
          resetForm.style.display = "block";
          return;
        }

        const hash = window.location.hash;

        if (!hash) {
          loading.style.display = "none";

          showMessage(
            "Deze wachtwoordlink is ongeldig of verlopen. Vraag een nieuwe resetlink aan.",
            "error"
          );

          return;
        }

        supabaseClient.auth.onAuthStateChange(
          async (event, session) => {

            if (
              event === "PASSWORD_RECOVERY" &&
              session
            ) {
              loading.style.display = "none";
              resetForm.style.display = "block";
            }
          }
        );

        /*
          Give Supabase a moment to process the
          recovery session from the URL.
        */

        setTimeout(async () => {

          const { data: currentSession } =
            await supabaseClient.auth.getSession();

          if (currentSession && currentSession.session) {
            loading.style.display = "none";
            resetForm.style.display = "block";
          } else {
            loading.style.display = "none";

            showMessage(
              "De resetlink kon niet worden geverifieerd. Vraag een nieuwe wachtwoordreset aan.",
              "error"
            );
          }

        }, 1000);

      } catch (error) {

        console.error(
          "Hummie Bear password recovery error:",
          error
        );

        loading.style.display = "none";

        showMessage(
          "Er ging iets mis bij het controleren van de resetlink.",
          "error"
        );
      }
    }

    resetForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();

        const password =
          passwordInput.value.trim();

        const passwordConfirm =
          passwordConfirmInput.value.trim();

        message.className = "message";
        message.textContent = "";

        if (password.length < 8) {
          showMessage(
            "Je wachtwoord moet minstens 8 tekens bevatten.",
            "error"
          );

          return;
        }

        if (password !== passwordConfirm) {
          showMessage(
            "De twee wachtwoorden zijn niet hetzelfde.",
            "error"
          );

          return;
        }

        submitButton.disabled = true;
        submitButton.textContent =
          "Wachtwoord instellen...";

        try {

          const { error } =
            await supabaseClient.auth.updateUser({
              password: password
            });

          if (error) {
            console.error(
              "Hummie Bear password update error:",
              error
            );

            showMessage(
              error.message ||
              "Het wachtwoord kon niet worden aangepast.",
              "error"
            );

            submitButton.disabled = false;
            submitButton.textContent =
              "Wachtwoord instellen";

            return;
          }

          showMessage(
            "Je wachtwoord is succesvol aangepast. Je wordt doorgestuurd naar het beheer.",
            "success"
          );

          passwordInput.value = "";
          passwordConfirmInput.value = "";

          setTimeout(() => {
            window.location.href =
              "https://hummiebear.be/admin.html";
          }, 1800);

        } catch (error) {

          console.error(
            "Hummie Bear password update error:",
            error
          );

          showMessage(
            "Er is een onverwachte fout opgetreden. Probeer opnieuw.",
            "error"
          );

          submitButton.disabled = false;
          submitButton.textContent =
            "Wachtwoord instellen";
        }
      }
    );

    initialiseRecovery();
  </script>

</body>
</html>
