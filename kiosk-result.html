<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101010"><title>Bestelling | Hummie Bear</title><link rel="stylesheet" href="/self-order.css"></head><body><header class="top"><div class="logo">HUMMIE <b>BEAR</b></div></header><main><section class="builder"><p class="eyebrow">HUMMIE BEAR</p><h1 id="headline">We controleren je bestelling.</h1><p id="message">Mollie bevestigt je betaling veilig. Dit scherm controleert automatisch de status.</p><div id="receipt" hidden></div><p id="status" class="muted">Even geduld…</p><button id="print" class="primary" hidden onclick="window.print()">Bestelling afdrukken</button><p><a href="/self-order.html">Terug naar bestellen</a></p></section></main><script>
const id=new URLSearchParams(location.search).get('order');const $=s=>document.querySelector(s);const money=c=>(Number(c||0)/100).toLocaleString('nl-BE',{style:'currency',currency:'EUR'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let attempts=0;async function check(){if(!id){$('#status').textContent='Geen bestelnummer gevonden.';return}try{const r=await fetch('/api/kiosk-order-status?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(!r.ok)throw new Error(d.error||'Status onbekend');if(d.payment_status==='paid'||d.payment_status==='included'){ $('#headline').textContent='Bedankt, '+(d.customer_name||'');$('#message').textContent=d.payment_status==='included'?'Je bestelling is geregistreerd als inbegrepen bij het evenement.':'Je betaling is bevestigd. Je bestelling gaat naar onze bakker.';$('#status').textContent='Bestelnummer: '+d.order_number;$('#receipt').hidden=false;$('#receipt').innerHTML='<h2>Bestelbewijs · '+esc(d.order_number)+'</h2><p>'+esc(d.customer_name)+' · '+new Date(d.created_at).toLocaleString('nl-BE')+'</p><ul>'+(d.items||[]).map(i=>'<li>Lollywafel · '+esc(i.chocolate)+' · '+esc(i.sauce)+(i.toppings?.length?' · '+esc(i.toppings.join(', ')):'')+'</li>').join('')+'</ul><p><strong>'+(d.payment_status==='included'?'Inbegrepen':money(d.total_cents))+'</strong></p><p class="muted">Bewaar dit bestelnummer voor het afhalen.</p>';$('#print').hidden=false;return}if(['failed','expired','canceled'].includes(d.payment_status)){ $('#headline').textContent='Betaling niet voltooid';$('#message').textContent='De betaling is niet afgerond. Vraag een medewerker om hulp of start een nieuwe bestelling.';$('#status').textContent='Status: '+d.payment_status;return}$('#status').textContent='Betaling wordt gecontroleerd… Bestelling '+d.order_number;}catch(e){$('#status').textContent=e.message}attempts++;if(attempts<60)setTimeout(check,2000);else $('#status').textContent='We kunnen de betaling nog niet bevestigen. Toon dit scherm aan een medewerker; die kan de status nakijken.'}check();
</script></body></html>
