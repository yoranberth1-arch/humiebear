<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f8ead8"><title>Betaling | Hummmie Bear</title><link rel="stylesheet" href="/kiosk.css"><style>.confirmation .success-mark{font-size:3rem;color:#24834b;margin-bottom:12px}.confirmation.waiting{max-width:560px}.confirmation .primary{display:inline-block;text-decoration:none;margin-top:18px}</style></head><body><header class="top"><div class="brand">HUMMMIE <b>BEAR</b></div></header><main class="confirmation waiting"><p class="eyebrow">HUMMMIE BEAR</p><div id="mark" class="success-mark" hidden>✓</div><h1 id="title">Betaling controleren…</h1><p id="message">Een ogenblik geduld. We controleren of je betaling succesvol is afgerond.</p><h2 id="number"></h2><p id="status"></p><a id="home" class="primary" href="/bestellen.html" hidden>Terug naar beginscherm</a></main><script>(async()=>{const id=new URLSearchParams(location.search).get('order');const title=document.getElementById('title'),message=document.getElementById('message'),number=document.getElementById('number'),status=document.getElementById('status'),mark=document.getElementById('mark'),home=document.getElementById('home');if(!id){title.textContent='Geen bestelling gevonden';message.textContent='Ga terug naar het beginscherm en probeer opnieuw.';home.hidden=false;return}const started=Date.now();while(Date.now()-started<60000){try{const r=await fetch('/api/kiosk/status?id='+encodeURIComponent(id),{cache:'no-store'});const d=await r.json();if(r.ok){if(d.payment_status==='paid'||d.payment_status==='included'){number.textContent=d.order_number?'Bestelnummer: '+d.order_number:'';mark.hidden=false;title.textContent='Je hebt betaald. Bedankt voor je bestelling!';message.textContent='Je betaling is goed ontvangen. We maken je bestelling klaar.';status.textContent='Betaling bevestigd.';home.hidden=true;setTimeout(()=>location.replace('/bestellen.html'),3000);return}if(['failed','expired','canceled'].includes(d.payment_status)){title.textContent='Betaling niet gelukt';message.textContent='Er is geen betaling ontvangen en je bestelling is niet bevestigd.';status.textContent='Je kunt opnieuw proberen.';home.hidden=false;setTimeout(()=>location.replace('/bestellen.html'),5000);return}}}catch(e){}await new Promise(resolve=>setTimeout(resolve,1200))}title.textContent='Betaling nog niet bevestigd';message.textContent='We hebben nog geen bevestiging ontvangen. Je bestelling verschijnt pas zodra de betaling bevestigd is. Vraag indien nodig een medewerker om hulp.';home.hidden=false;})();</script></body></html>
