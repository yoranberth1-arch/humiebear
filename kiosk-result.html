<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bestelling | Hummmie Bear</title><link rel="stylesheet" href="/kiosk.css"></head><body><header class="top"><div class="brand">HUMMMIE <b>BEAR</b></div></header><main class="confirmation"><p class="eyebrow">HUMMMIE BEAR</p><h1 id="title">Bestelling ontvangen</h1><p id="message">We controleren je bestelling.</p><h2 id="number"></h2><p id="status"></p><a class="primary" href="/bestellen.html">Nieuwe bestelling</a></main><script>(async()=>{const id=new URLSearchParams(location.search).get('order');if(!id)return;try{const r=await fetch('/api/kiosk/status?id='+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error();document.getElementById('number').textContent=d.order_number;document.getElementById('status').textContent=d.payment_status==='paid'||d.payment_status==='included'?'Betaling bevestigd. Bedankt!':d.payment_method==='cash'?'Je betaalt cash aan onze medewerker.':'Betaling: '+d.payment_status;document.getElementById('title').textContent='Bedankt voor je bestelling!';document.getElementById('message').textContent='Je bestelnummer staat hierboven.'}catch(e){document.getElementById('message').textContent='Je bestelling wordt verwerkt. Vraag indien nodig een medewerker.'}})();</script></body></html>
